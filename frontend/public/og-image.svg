<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Hintergrund cremeweiß -->
  <rect width="1200" height="630" fill="#FBF8F3"/>

  <!-- Demo-Banner oben -->
  <rect width="1200" height="56" fill="#2A2D34"/>
  <text x="600" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" fill="#ffffff" text-anchor="middle">
    Interne Entwicklungs-Demo. Nicht für Kinder bestimmt.
  </text>

  <!-- Logo: Glühbirne -->
  <g transform="translate(420, 180)">
    <circle cx="60" cy="50" r="50" fill="#FFC857"/>
    <rect x="32" y="100" width="56" height="16" rx="5" fill="#2A2D34"/>
    <rect x="38" y="120" width="44" height="9" rx="3" fill="#2A2D34"/>
  </g>

  <!-- Marke -->
  <text x="540" y="260" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="120" font-weight="700" fill="#2A2D34" dominant-baseline="middle">
    frag KIm
  </text>

  <!-- Untertitel -->
  <text x="600" y="380" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="36" font-weight="400" fill="#2A2D34" text-anchor="middle">
    Kindersichere KI-Wissensauskunft
  </text>
  <text x="600" y="430" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="400" fill="#6b6f78" text-anchor="middle">
    RAG über Klexikon · Mistral · EU-gehostet · Proof of Concept
  </text>

  <!-- Akzent-Linie unten -->
  <rect x="0" y="600" width="1200" height="30" fill="#2bb3a3"/>
</svg>
